<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwdoaOE00ZM9cv_Lti5UCq6ayxd_NqjMhdkNmWzAU_2xWVfZukHaMytNnrmHkEKqTNp/exec";


const DB_NAME =
"LectorProductosDB";

const DB_VERSION = 1;

const STORE_NAME =
"productos";


let productos = [];

let indice = {};

let scanner = null;

let escaneando = false;


// =====================================================
// INDEXEDDB
// =====================================================

function abrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// =====================================================
// GUARDAR BASE
// =====================================================

async function guardarBaseDB() {

  const db =
    await abrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      store.put({

        id: "base",

        productos:
          productos,

        fecha:
          new Date().toISOString()

      });


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


// =====================================================
// LEER BASE
// =====================================================

async function cargarBaseDB() {

  const db =
    await abrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.get("base");


      request.onsuccess =
        function() {

          resolve(
            request.result || null
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// =====================================================
// CREAR ÍNDICE
// =====================================================

function construirIndice() {

  indice = {};


  for (
    let i = 0;
    i < productos.length;
    i++
  ) {

    const producto =
      productos[i];


    const codigo =
      String(
        producto["BARRAS"] || ""
      ).trim();


    if (!codigo) {
      continue;
    }


    indice[codigo] =
      producto;

  }

}


// =====================================================
// FECHA
// =====================================================

function mostrarFecha(fecha) {

  if (!fecha) {
    return;
  }


  const fechaLocal =
    new Date(fecha);


  document.getElementById(
    "fecha"
  ).innerText =
    "🕐 Última actualización: " +
    fechaLocal.toLocaleString(
      "es-CL"
    );

}


// =====================================================
// CARGAR BASE LOCAL
// =====================================================

async function cargarBaseLocal() {

  try {

    document.getElementById(
      "estado"
    ).innerText =
      "📱 Cargando base local...";


    const datos =
      await cargarBaseDB();


    if (
      datos &&
      Array.isArray(
        datos.productos
      ) &&
      datos.productos.length > 0
    ) {

      productos =
        datos.productos;


      construirIndice();


      mostrarFecha(
        datos.fecha
      );


      document.getElementById(
        "estado"
      ).innerText =
        "🟢 " +
        productos.length +
        " productos";


      document.getElementById(
        "mensaje"
      ).innerText =
        "📷 Listo para escanear";


      iniciarScanner();


      return;

    }


    descargarBase();


  } catch(error) {

    console.error(error);

    descargarBase();

  }

}


// =====================================================
// DESCARGAR
// =====================================================

function descargarBase() {

  document.getElementById(
    "estado"
  ).innerText =
    "⬇️ Descargando productos...";


  const callback =
    "productos_" +
    Date.now();


  window[callback] =
    async function(data) {

      try {

        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "Respuesta incorrecta"
          );

        }


        productos =
          data;


        construirIndice();


        await guardarBaseDB();


        mostrarFecha(
          new Date()
        );


        document.getElementById(
          "estado"
        ).innerText =
          "🟢 " +
          productos.length +
          " productos";


        document.getElementById(
          "mensaje"
        ).innerText =
          "📷 Listo para escanear";


        delete window[callback];


        iniciarScanner();

      } catch(error) {

        console.error(error);

        delete window[callback];

        usarBaseAnterior();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?accion=productos&callback=" +
    callback;


  script.onerror =
    function() {

      delete window[callback];

      usarBaseAnterior();

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// USAR BASE ANTERIOR
// =====================================================

async function usarBaseAnterior() {

  try {

    const datos =
      await cargarBaseDB();


    if (
      !datos ||
      !datos.productos
    ) {

      document.getElementById(
        "estado"
      ).innerText =
        "❌ No hay productos disponibles";


      document.getElementById(
        "mensaje"
      ).innerText =
        "Necesitas Internet para descargar la base.";


      return;

    }


    productos =
      datos.productos;


    construirIndice();


    mostrarFecha(
      datos.fecha
    );


    document.getElementById(
      "estado"
    ).innerText =
      "🟢 Usando copia local";


    document.getElementById(
      "mensaje"
    ).innerText =
      "📷 Listo para escanear";


    iniciarScanner();

  } catch(error) {

    console.error(error);

  }

}


// =====================================================
// ACTUALIZAR
// =====================================================

function actualizarBase() {

  const confirmar =
    confirm(
      "¿Actualizar los productos desde Google Sheets?"
    );


  if (!confirmar) {
    return;
  }


  detenerScanner();


  descargarBase();

}


// =====================================================
// ESCÁNER
// =====================================================

function iniciarScanner() {

  if (escaneando) {
    return;
  }


  if (
    productos.length === 0
  ) {

    return;

  }


  escaneando = true;


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 300,
        height: 150
      }

    },

    function(codigoDetectado) {

      detenerScanner();


      buscarProductoLocal(
        codigoDetectado
      );

    },

    function(error) {

      // Ignorar errores normales.

    }

  )


  .catch(
    function(error) {

      console.error(error);

      escaneando = false;


      document.getElementById(
        "mensaje"
      ).innerText =
        "❌ No se pudo acceder a la cámara.";

    }
  );

}


// =====================================================
// DETENER ESCÁNER
// =====================================================

function detenerScanner() {

  if (!scanner) {

    escaneando = false;

    return;

  }


  scanner.stop()

    .then(
      function() {

        scanner.clear();

        scanner = null;

        escaneando = false;

      }
    )

    .catch(
      function(error) {

        console.error(error);

        scanner = null;

        escaneando = false;

      }
    );

}


// =====================================================
// BÚSQUEDA LOCAL
// =====================================================

function buscarProductoLocal(
  codigo
) {

  const inicio =
    performance.now();


  const producto =
    indice[
      String(codigo).trim()
    ];


  const tiempo =
    Math.round(
      performance.now() -
      inicio
    );


  if (!producto) {

    document.getElementById(
      "mensaje"
    ).innerText =
      "❌ Producto no encontrado.";


    limpiarResultado();


    return;

  }


  mostrarProducto(
    producto,
    tiempo
  );

}


// =====================================================
// MOSTRAR PRODUCTO
// =====================================================

function mostrarProducto(
  producto,
  tiempo
) {

  document.getElementById(
    "mensaje"
  ).innerText =
    "✅ Encontrado en " +
    tiempo +
    " ms";


  document.getElementById(
    "codigoInterno"
  ).innerText =
    producto[
      "CODIGO INTERNO"
    ] || "-";


  document.getElementById(
    "descriptor"
  ).innerText =
    producto[
      "DESCRIPTOR"
    ] || "-";


  document.getElementById(
    "precio"
  ).innerText =
    producto[
      "PRECIO"
    ] || "-";


  document.getElementById(
    "barras"
  ).innerText =
    producto[
      "BARRAS"
    ] || "-";


  const oaiCard =
    document.getElementById(
      "oaiCard"
    );


  const precioOAI =
    String(
      producto["PRECIOOAI"] || ""
    ).trim();


  if (
    precioOAI !== ""
  ) {

    document.getElementById(
      "precioOAI"
    ).innerText =
      precioOAI;


    oaiCard.classList.remove(
      "oculto"
    );

  } else {

    document.getElementById(
      "precioOAI"
    ).innerText =
      "";


    oaiCard.classList.add(
      "oculto"
    );

  }

}


// =====================================================
// LIMPIAR RESULTADO
// =====================================================

function limpiarResultado() {

  document.getElementById(
    "codigoInterno"
  ).innerText = "";


  document.getElementById(
    "descriptor"
  ).innerText = "";


  document.getElementById(
    "precio"
  ).innerText = "";


  document.getElementById(
    "precioOAI"
  ).innerText = "";


  document.getElementById(
    "barras"
  ).innerText = "";


  document.getElementById(
    "oaiCard"
  ).classList.add(
    "oculto"
  );

}


// =====================================================
// SERVICE WORKER
// =====================================================

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function() {

            console.log(
              "Service Worker registrado"
            );

          }
        )
        .catch(
          function(error) {

            console.error(
              "Error registrando Service Worker:",
              error
            );

          }
        );

    }
  );

}


// =====================================================
// INICIO
// =====================================================

cargarBaseLocal();


</script>

</body>
