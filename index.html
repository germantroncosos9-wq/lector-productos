<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00843D">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Lector de Productos</title>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --verde: #00843D;
      --verde-oscuro: #006B32;
      --verde-claro: #E8F5EE;
      --amarillo: #FFD500;
      --blanco: #FFFFFF;
      --fondo: #F4F7F5;
      --gris: #667085;
      --gris-claro: #E5E7EB;
      --texto: #1F2937;
      --rojo: #D92D20;
    }

    /* ===== TEMAS ===== */
    body[data-theme="default"] {
      --verde: #00843d;
      --verde-oscuro: #006b31;
      --verde-suave: #e8f5ee;
      --fondo: #f4f6f5;
      --tarjeta: #ffffff;
      --texto: #1f2a24;
      --texto-suave: #66706b;
      --borde: #dfe7e2;
      --input: #ffffff;
      --sombra: rgba(0, 0, 0, 0.08);
      --oai-fondo: #eaf8ef;
      --oai-borde: #b9e3c8;
    }

    body[data-theme="dark"] {
      --verde: #2ecc71;
      --verde-oscuro: #20b862;
      --verde-suave: #183126;
      --fondo: #111714;
      --tarjeta: #1b2420;
      --texto: #f2f7f4;
      --texto-suave: #aab8b0;
      --borde: #33423a;
      --input: #141c18;
      --sombra: rgba(0, 0, 0, 0.30);
      --oai-fondo: #193326;
      --oai-borde: #2c6a45;
    }

    body[data-theme="pink"] {
      --verde: #d56f9d;
      --verde-oscuro: #b95784;
      --verde-suave: #fdebf3;
      --fondo: #fff6fa;
      --tarjeta: #fffafd;
      --texto: #563947;
      --texto-suave: #8d6b7b;
      --borde: #f1ccdc;
      --input: #ffffff;
      --sombra: rgba(181, 87, 132, 0.10);
      --oai-fondo: #ffeaf3;
      --oai-borde: #f0b8d0;
    }

    body {
      background: var(--fondo) !important;
      color: var(--texto) !important;
      transition: background-color .25s ease, color .25s ease;
    }

    .tema-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0 10px;
      flex-wrap: wrap;
    }

    .tema-btn {
      appearance: none;
      border: 1px solid var(--borde);
      background: var(--tarjeta);
      color: var(--texto);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 7px var(--sombra);
      transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
    }

    .tema-btn:active {
      transform: scale(.97);
    }

    .tema-btn.activo {
      background: var(--verde);
      border-color: var(--verde);
      color: #fff;
    }

    /* Adaptaciones visuales para los temas */
    body[data-theme="dark"] .card,
    body[data-theme="dark"] .status-card,
    body[data-theme="dark"] .result-card,
    body[data-theme="dark"] .search-box,
    body[data-theme="dark"] input {
      background: var(--tarjeta) !important;
      color: var(--texto) !important;
      border-color: var(--borde) !important;
    }

    body[data-theme="dark"] input::placeholder {
      color: #819087;
    }

    body[data-theme="dark"] .app-intro p,
    body[data-theme="dark"] footer,
    body[data-theme="pink"] .app-intro p,
    body[data-theme="pink"] footer {
      color: var(--texto-suave) !important;
    }

    body[data-theme="pink"] .app-intro h2,
    body[data-theme="pink"] .codigo-label,
    body[data-theme="pink"] .codigo-valor {
      color: var(--verde-oscuro) !important;
    }

    body[data-theme="pink"] button:not(.tema-btn) {
      background-color: var(--verde) !important;
      border-color: var(--verde) !important;
    }


    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }

    header {
      background: transparent;
      border-radius: 16px;
      padding: 0;
      margin-bottom: 12px;
      box-shadow: none;
      overflow: hidden;
    }

    header img {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      object-fit: contain;
      object-position: center;
      border-radius: 16px;
    }

    header h1 {
      display: none;
    }

    .app-intro {
      text-align: center;
      margin: 2px 0 14px;
      padding: 0 8px;
    }

    .app-intro h2 {
      margin: 0 0 3px;
      color: var(--verde);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
    }

    .app-intro p {
      margin: 0;
      color: #66706b;
      font-size: 14px;
      font-weight: 500;
    }

    .estado {
      text-align: center;
      background: white;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--gris);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .estado strong {
      color: var(--verde);
    }

    .buscador {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .buscador input {
      width: 100%;
      border: 2px solid var(--gris-claro);
      border-radius: 12px;
      padding: 15px;
      font-size: 18px;
      outline: none;
      text-align: center;
    }

    .buscador input:focus {
      border-color: var(--verde);
    }

    .botones {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-actualizar {
      flex: 1;
      background: var(--verde);
      color: white;
    }

    .btn-actualizar:hover {
      background: var(--verde-oscuro);
    }

    .btn-escanear {
      flex: 1;
      background: white;
      color: var(--verde);
      border: 2px solid var(--verde);
    }

    .mensaje {
      text-align: center;
      padding: 15px;
      color: var(--gris);
      font-size: 15px;
    }

    .resultado {
      display: none;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .etiqueta {
      color: var(--gris);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .codigo-card {
      background: var(--verde);
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(0,132,61,0.22);
    }

    .codigo-card .etiqueta {
      color: rgba(255,255,255,0.85);
    }

    .codigo-valor {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
      word-break: break-word;
    }

    .precio-card {
      text-align: center;
    }

    .precio-valor {
      font-size: 27px;
      font-weight: 800;
    }

    .oai-card {
      background: var(--verde-claro);
      border: 2px solid var(--verde);
      text-align: center;
    }

    .oai-card .etiqueta {
      color: var(--verde-oscuro);
    }

    .oai-valor {
      color: var(--verde-oscuro);
      font-size: 31px;
      font-weight: 900;
    }

    /* ===== SUPER OAI ===== */
    .oai-card.super-oai-card {
      background: linear-gradient(135deg, #fff8dc 0%, #f6d365 100%) !important;
      border: 2px solid #c99700 !important;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.24) !important;
    }

    .oai-card.super-oai-card .etiqueta,
    .oai-card.super-oai-card .oai-valor,
    body[data-theme="dark"] .oai-card.super-oai-card .etiqueta,
    body[data-theme="dark"] .oai-card.super-oai-card .oai-valor,
    body[data-theme="pink"] .oai-card.super-oai-card .etiqueta,
    body[data-theme="pink"] .oai-card.super-oai-card .oai-valor {
      color: #6f5100 !important;
    }

    .descriptor {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.35;
    }

    .barras {
      font-size: 14px;
      color: var(--gris);
      word-break: break-word;
      line-height: 1.5;
    }

    .tiempo {
      text-align: center;
      color: var(--gris);
      font-size: 12px;
      margin-top: 8px;
    }

    .oculto {
      display: none !important;
    }

    .error {
      color: var(--rojo);
      font-weight: bold;
    }

    .cargando {
      color: var(--verde);
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: var(--gris);
      font-size: 11px;
      padding: 15px 0 5px;
    }

    @media (max-width: 400px) {
      header {
        padding: 0;
        min-height: 0;
        border-radius: 14px;
      }

      header img {
        width: 100%;
        max-width: none;
        height: auto;
        object-fit: contain;
        border-radius: 14px;
      }

      .codigo-valor {
        font-size: 32px;
      }

      .precio-valor {
        font-size: 24px;
      }

      .oai-valor {
        font-size: 28px;
      }
    }
  
    /* ===== CONTRASTE COMPLETO PARA TEMAS ===== */
    body[data-theme="dark"] .app-intro h2,
    body[data-theme="dark"] h1,
    body[data-theme="dark"] h2,
    body[data-theme="dark"] h3,
    body[data-theme="dark"] label,
    body[data-theme="dark"] .label,
    body[data-theme="dark"] .descriptor,
    body[data-theme="dark"] .descriptor-valor,
    body[data-theme="dark"] .precio-label,
    body[data-theme="dark"] .status-text,
    body[data-theme="dark"] .ultima-actualizacion,
    body[data-theme="dark"] .last-update,
    body[data-theme="dark"] p,
    body[data-theme="dark"] span {
      color: var(--texto) !important;
    }

    body[data-theme="dark"] .app-intro p,
    body[data-theme="dark"] footer,
    body[data-theme="dark"] .muted,
    body[data-theme="dark"] .secondary,
    body[data-theme="dark"] small {
      color: var(--texto-suave) !important;
    }

    body[data-theme="dark"] input,
    body[data-theme="dark"] input[type="text"],
    body[data-theme="dark"] input[type="search"] {
      background: var(--input) !important;
      color: var(--texto) !important;
      border-color: var(--borde) !important;
    }

    body[data-theme="dark"] .codigo-valor,
    body[data-theme="dark"] .oai-valor,
    body[data-theme="dark"] .precio-valor {
      color: #f4fff8 !important;
    }

    body[data-theme="pink"] h1,
    body[data-theme="pink"] h2,
    body[data-theme="pink"] h3,
    body[data-theme="pink"] label,
    body[data-theme="pink"] .label,
    body[data-theme="pink"] .descriptor,
    body[data-theme="pink"] .descriptor-valor,
    body[data-theme="pink"] .precio-label,
    body[data-theme="pink"] .status-text,
    body[data-theme="pink"] .ultima-actualizacion,
    body[data-theme="pink"] .last-update,
    body[data-theme="pink"] p,
    body[data-theme="pink"] span {
      color: var(--texto) !important;
    }

    body[data-theme="pink"] .app-intro h2,
    body[data-theme="pink"] .codigo-label,
    body[data-theme="pink"] .codigo-valor,
    body[data-theme="pink"] .oai-valor {
      color: var(--verde-oscuro) !important;
    }

    body[data-theme="pink"] .app-intro p,
    body[data-theme="pink"] footer,
    body[data-theme="pink"] .muted,
    body[data-theme="pink"] .secondary,
    body[data-theme="pink"] small {
      color: var(--texto-suave) !important;
    }

    body[data-theme="pink"] input,
    body[data-theme="pink"] input[type="text"],
    body[data-theme="pink"] input[type="search"] {
      background: #ffffff !important;
      color: #563947 !important;
      border-color: var(--borde) !important;
    }

    body[data-theme="pink"] input::placeholder {
      color: #9a7888 !important;
      opacity: 1;
    }

    /* Los botones conservan texto blanco para asegurar contraste */
    body[data-theme="dark"] button:not(.tema-btn),
    body[data-theme="pink"] button:not(.tema-btn) {
      color: #ffffff !important;
    }

    /* No forzar color del emoji dentro del selector */
    body[data-theme="dark"] .tema-btn,
    body[data-theme="pink"] .tema-btn {
      color: inherit !important;
    }


    /* ===== AJUSTE FINAL DE CONTRASTE ===== */

    /* NOCTURNO: tarjetas realmente oscuras */
    body[data-theme="dark"] .producto-codigo,
    body[data-theme="dark"] .producto-descriptor,
    body[data-theme="dark"] .producto-precio,
    body[data-theme="dark"] .producto-barras,
    body[data-theme="dark"] .resultado > div,
    body[data-theme="dark"] .result-card > div {
      background-color: #1b2420 !important;
      color: #f2f7f4 !important;
    }

    body[data-theme="dark"] .producto-codigo {
      background-color: #24b966 !important;
    }

    body[data-theme="dark"] .producto-oai {
      background-color: #193326 !important;
      border-color: #2ecc71 !important;
    }

    body[data-theme="dark"] .descriptor-valor,
    body[data-theme="dark"] .precio-valor,
    body[data-theme="dark"] .barras-valor,
    body[data-theme="dark"] #descriptor,
    body[data-theme="dark"] #precio,
    body[data-theme="dark"] #barras {
      color: #f2f7f4 !important;
    }

    body[data-theme="dark"] .oai-valor,
    body[data-theme="dark"] #precioOai {
      color: #39dc80 !important;
    }

    /* ROSA: contraste más fuerte en código y botones */
    body[data-theme="pink"] .producto-codigo {
      background-color: #d76b9c !important;
    }

    body[data-theme="pink"] .producto-codigo *,
    body[data-theme="pink"] .producto-codigo .codigo-label,
    body[data-theme="pink"] .producto-codigo .codigo-valor,
    body[data-theme="pink"] #codigoInterno {
      color: #ffffff !important;
    }

    body[data-theme="pink"] .producto-oai {
      background-color: #fff2f7 !important;
      border-color: #e967a1 !important;
    }

    body[data-theme="pink"] .oai-valor,
    body[data-theme="pink"] #precioOai {
      color: #c94f87 !important;
    }

    /* Botones: nunca perder el texto */
    body[data-theme="dark"] #btnActualizar,
    body[data-theme="dark"] #btnEscanear,
    body[data-theme="pink"] #btnActualizar,
    body[data-theme="pink"] #btnEscanear {
      color: #ffffff !important;
    }

    body[data-theme="dark"] #btnEscanear {
      background-color: transparent !important;
      color: #2ecc71 !important;
      border-color: #2ecc71 !important;
    }

    /* En rosa ambos botones llevan texto visible */
    body[data-theme="pink"] button:not(.tema-btn) {
      color: #ffffff !important;
    }


    /* ===== ÚLTIMO AJUSTE: BUSCADOR Y BOTÓN ESCANEAR ===== */
    body[data-theme="dark"] input::placeholder {
      color: #d7e2dc !important;
      opacity: 1 !important;
    }

    body[data-theme="dark"] #btnEscanear,
    body[data-theme="dark"] .btn-escanear,
    body[data-theme="dark"] button[onclick*="camara"],
    body[data-theme="dark"] button[onclick*="Camara"],
    body[data-theme="dark"] button[onclick*="scanner"],
    body[data-theme="dark"] button[onclick*="Scanner"] {
      background: transparent !important;
      color: #2ecc71 !important;
      border-color: #2ecc71 !important;
    }

    body[data-theme="pink"] input::placeholder {
      color: #8d6b7b !important;
      opacity: 1 !important;
    }

    body[data-theme="pink"] #btnEscanear,
    body[data-theme="pink"] .btn-escanear,
    body[data-theme="pink"] button[onclick*="camara"],
    body[data-theme="pink"] button[onclick*="Camara"],
    body[data-theme="pink"] button[onclick*="scanner"],
    body[data-theme="pink"] button[onclick*="Scanner"] {
      color: #ffffff !important;
    }


    body[data-theme="dark"] button:not(.tema-btn) span,
    body[data-theme="pink"] button:not(.tema-btn) span {
      color: inherit !important;
    }


    /* ===== MODO NOCTURNO: BLOQUES SUPERIORES ===== */
    body[data-theme="dark"] .estado,
    body[data-theme="dark"] .buscador {
      background: #1b2420 !important;
      color: #f2f7f4 !important;
      box-shadow: 0 3px 10px rgba(0,0,0,0.28) !important;
    }

    body[data-theme="dark"] .estado {
      color: #d8e3dd !important;
    }

    body[data-theme="dark"] .estado strong {
      color: #2ecc71 !important;
    }

    body[data-theme="dark"] .buscador input {
      background: #121a16 !important;
      color: #f2f7f4 !important;
      border-color: #405249 !important;
    }

    body[data-theme="dark"] .buscador input::placeholder {
      color: #b9c7bf !important;
      opacity: 1 !important;
    }

    body[data-theme="dark"] .btn-escanear {
      background: #1b2420 !important;
      color: #2ecc71 !important;
      border-color: #2ecc71 !important;
    }

    body[data-theme="dark"] .btn-actualizar {
      background: #2ecc71 !important;
      color: #ffffff !important;
    }


    /* ===== AVISO DESDE CONFIG ===== */
    .aviso-base {
      display: none;
      margin: -2px 0 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff8dc;
      border: 1px solid #e5c34d;
      color: #6f5100;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      box-shadow: 0 2px 8px rgba(184, 134, 11, 0.12);
    }

    body[data-theme="dark"] .aviso-base {
      background: #2b2818 !important;
      border-color: #8f7a2e !important;
      color: #f4df83 !important;
    }

    body[data-theme="pink"] .aviso-base {
      background: #fff0f6 !important;
      border-color: #e8a8c4 !important;
      color: #8f4567 !important;
    }


    /* ===== VISTA COMPACTA: RESULTADOS MÁS ARRIBA ===== */
    header { margin-bottom: 7px !important; }
    header img { max-height: 105px; object-fit: cover; }
    .app-intro { margin: 0 0 8px !important; }
    .app-intro h2 { font-size: 19px !important; margin-bottom: 1px !important; }
    .app-intro p { font-size: 12px !important; }

    .estado {
      padding: 6px 10px !important;
      margin-bottom: 7px !important;
      font-size: 11px !important;
      line-height: 1.35;
    }

    .buscador {
      padding: 10px !important;
      margin-bottom: 8px !important;
      border-radius: 14px !important;
    }

    .buscador input { padding: 11px !important; font-size: 16px !important; }
    .botones { margin-top: 7px !important; gap: 7px !important; }
    .botones button { padding: 10px 7px !important; font-size: 13px !important; }
    .mensaje { padding: 7px 10px !important; font-size: 13px !important; }

    .aviso-base {
      margin: 10px 0 4px !important;
    }

    @media (max-width: 400px) {
      header img { max-height: 88px; }
      .contenedor { padding-top: 9px; }
      .app-intro h2 { font-size: 18px !important; }
    }


    /* ===== SONIDOS ===== */
    .sonido-control {
      display: flex;
      justify-content: center;
      margin: 8px 0 2px;
    }

    .sonido-btn {
      width: 44px;
      height: 44px;
      padding: 0 !important;
      border-radius: 50%;
      border: 1px solid var(--borde);
      background: var(--tarjeta);
      color: var(--texto);
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 2px 7px var(--sombra);
    }

    body[data-theme="dark"] .sonido-btn {
      background: #1b2420 !important;
      color: #f2f7f4 !important;
      border-color: #405249 !important;
    }

    body[data-theme="pink"] .sonido-btn {
      background: #fffafd !important;
      color: #563947 !important;
      border-color: #f1ccdc !important;
    }


/* ===== MEJORAS EXTRA ===== */
.codigo-card{cursor:pointer;position:relative}
.copiado-flash{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.75);color:#fff;
padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;opacity:0;pointer-events:none;
transition:.18s ease}
.copiado-flash.visible{opacity:1}
@keyframes superShimmer{0%{filter:brightness(1)}35%{filter:brightness(1.45)}
60%{filter:brightness(1.08)}80%{filter:brightness(1.38)}100%{filter:brightness(1)}}
.super-oai-card.super-oai-shimmer{animation:superShimmer .7s ease-out}
.ajustes-wrap{position:relative;display:flex;justify-content:center;margin:8px 0 3px}
.ajustes-btn{width:44px;height:44px;padding:0!important;border-radius:50%;border:1px solid var(--borde);
background:var(--tarjeta);color:var(--texto);font-size:19px;cursor:pointer;box-shadow:0 2px 7px var(--sombra)}

width:min(270px,calc(100vw - 40px));padding:10px 12px;border-radius:14px;background:var(--tarjeta);

</style>
  <script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

</head>

<body data-theme="default">

<div class="contenedor">

    >

    <div class="estado">

        <label class="ajuste-fila"><span>✨ Animación Super OAI</span><input id="ajusteAnimacion" type="checkbox"></label>

    </div>

<footer>

<script>


  /* =========================================================
     SONIDOS DE ESCANEO Y RESULTADOS
  ========================================================= */

  const SONIDO_KEY = "lectorProductosSonidos";
  let sonidosActivos = true;
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;

  try {
    sonidosActivos = localStorage.getItem(SONIDO_KEY) !== "off";
  } catch (e) {}

  function contextoAudio() {
    if (!audioCtx) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return null;
      audioCtx = new AudioContextClass();

      masterGain = audioCtx.createGain();
      compressor = audioCtx.createDynamicsCompressor();

      /* Refuerzo general de volumen */
      masterGain.gain.value = 2.4;

      compressor.threshold.value = -18;
      compressor.knee.value = 12;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.18;

      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }

    return audioCtx;
  }

  function tono(frecuencia, duracion, retraso = 0, volumen = 0.10, tipo = "sine") {
    if (!sonidosActivos) return;

    const ctx = contextoAudio();
    if (!ctx) return;

    const inicio = ctx.currentTime + retraso;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = tipo;
    osc.frequency.setValueAtTime(frecuencia, inicio);

    gain.gain.setValueAtTime(0.0001, inicio);
    gain.gain.exponentialRampToValueAtTime(volumen, inicio + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, inicio + duracion);

    osc.connect(gain);
    gain.connect(masterGain || ctx.destination);
    osc.start(inicio);
    osc.stop(inicio + duracion + 0.02);
  }

  function sonidoLectura() {
    tono(1050, 0.094, 0, 0.123, "square");
  }

  function sonidoNormal() {
    tono(660, 0.131, 0, 0.05);
    tono(880, 0.174, 0.075, 0.05);
  }

  function sonidoError() {
    tono(260, 0.18, 0, 0.167, "square");
    tono(190, 0.18, 0.13, 0.152, "square");
  }

  function sonidoOAI() {
    tono(620, 0.145, 0, 0.05);
    tono(830, 0.16, 0.08, 0.055);
    tono(1040, 0.18, 0.17, 0.055);
  }

  function sonidoSuperOAI() {
    /* Arpegio brillante tipo "shimmer": campanitas ascendentes */
    tono(659.25, 0.18, 0.00, 0.145, "sine");
    tono(987.77, 0.18, 0.055, 0.145, "sine");
    tono(1318.51, 0.18, 0.11, 0.152, "sine");
    tono(1567.98, 0.18, 0.17, 0.145, "sine");
    tono(1975.53, 0.18, 0.23, 0.131, "sine");

    /* Armónicos suaves para darle ese brillo/chispa */
    tono(2637.02, 0.18, 0.12, 0.058, "sine");
    tono(3135.96, 0.18, 0.20, 0.051, "sine");
  }



  /* ===== PREFERENCIAS / VIBRACIÓN / COPIAR / ANIMACIÓN ===== */
  const VIBRACION_KEY="lectorProductosVibracion";
  const ANIMACION_KEY="lectorProductosAnimacion";
  let vibracionActiva=true, animacionActiva=true;
  try{
    vibracionActiva=localStorage.getItem(VIBRACION_KEY)!=="off";
    animacionActiva=localStorage.getItem(ANIMACION_KEY)!=="off";
  }catch(e){}

  function vibrar(p){if(vibracionActiva&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
  function animarSuperOAI(){
    if(!animacionActiva)return;
    const c=document.getElementById("oaiCard"); if(!c)return;
    c.classList.remove("super-oai-shimmer"); void c.offsetWidth;
    c.classList.add("super-oai-shimmer");
    setTimeout(()=>c.classList.remove("super-oai-shimmer"),800);
  }
  function sincronizarAjustes(){
    const s=document.getElementById("ajusteSonido"),v=document.getElementById("ajusteVibracion"),
    a=document.getElementById("ajusteAnimacion");
    if(s)s.checked=sonidosActivos;if(v)v.checked=vibracionActiva;if(a)a.checked=animacionActiva;
  }
  const panelAjustes=document.getElementById("panelAjustes");
  document.getElementById("btnAjustes")?.addEventListener("click",e=>{
    e.stopPropagation();panelAjustes.classList.toggle("abierto");sincronizarAjustes();
  });
  panelAjustes?.addEventListener("click",e=>e.stopPropagation());
  document.addEventListener("click",()=>panelAjustes?.classList.remove("abierto"));
  document.getElementById("ajusteSonido")?.addEventListener("change",function(){
    sonidosActivos=this.checked;try{localStorage.setItem(SONIDO_KEY,sonidosActivos?"on":"off")}catch(e){}
    if(sonidosActivos){contextoAudio();tono(760,.07,0,.12)}
  });
  document.getElementById("ajusteVibracion")?.addEventListener("change",function(){
    vibracionActiva=this.checked;try{localStorage.setItem(VIBRACION_KEY,vibracionActiva?"on":"off")}catch(e){}
    if(vibracionActiva)vibrar(45)
  });
  document.getElementById("ajusteAnimacion")?.addEventListener("change",function(){
    animacionActiva=this.checked;try{localStorage.setItem(ANIMACION_KEY,animacionActiva?"on":"off")}catch(e){}
  });
  sincronizarAjustes();

  document.querySelector(".codigo-card")?.addEventListener("click",async()=>{
    const codigo=(document.getElementById("codigoInterno")?.textContent||"").trim(); if(!codigo)return;
    try{await navigator.clipboard.writeText(codigo)}
    catch(e){
      const t=document.createElement("textarea");t.value=codigo;t.style.position="fixed";t.style.opacity="0";
      document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}
      t.remove();
    }
    const f=document.getElementById("copiadoFlash");f?.classList.add("visible");
    vibrar(25);setTimeout(()=>f?.classList.remove("visible"),850);
  });

  /* =========================================================
     CONFIGURACIÓN
  ========================================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyqEEUwd53K_dH46WXre5iF55yQBoyOs_y5sRgbTIdroIMGvXcVDfP3H62EkKN3uqmz/exec";

  const DB_NAME = "LectorProductosDB";
  const DB_VERSION = 4;
  const STORE_NAME = "productos";

  let productos = [];
  let indice = {};
  let db = null;


  /* =========================================================
     NORMALIZACIÓN DE CÓDIGOS

     IMPORTANTE:
     - Mantiene los ceros iniciales.
     - Elimina espacios.
     - Elimina guiones.
     - Convierte a texto.
  ========================================================= */

  function normalizarCodigo(codigo) {

    if (codigo === null || codigo === undefined) {
      return "";
    }

    return String(codigo)
      .trim()
      .replace(/[\s-]/g, "");

  }


  /* =========================================================
     INICIALIZAR INDEXEDDB
  ========================================================= */

  function abrirDB() {

    return new Promise((resolve, reject) => {

      const request = indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

      request.onupgradeneeded = function(event) {

        const database = event.target.result;

        if (!database.objectStoreNames.contains(STORE_NAME)) {

          database.createObjectStore(
            STORE_NAME,
            { keyPath: "id" }
          );

        }

      };

      request.onsuccess = function(event) {

        db = event.target.result;

        resolve(db);

      };

      request.onerror = function(event) {

        reject(event.target.error);

      };

    });

  }


  /* =========================================================
     GUARDAR PRODUCTOS EN INDEXEDDB
  ========================================================= */

  function guardarProductos() {

    return new Promise((resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(STORE_NAME);

      store.put({
        id: "base",
        productos: productos,
        fecha: new Date().toISOString()
      });

      transaction.oncomplete = function() {

        resolve();

      };

      transaction.onerror = function(event) {

        reject(event.target.error);

      };

    });

  }


  /* =========================================================
     CARGAR PRODUCTOS DESDE INDEXEDDB
  ========================================================= */

  function cargarProductosGuardados() {

    return new Promise((resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(STORE_NAME);

      const request =
        store.get("base");

      request.onsuccess = function() {

        if (request.result) {

          productos =
            request.result.productos || [];

          construirIndice();

          mostrarCantidad();

          mostrarFecha(
            request.result.fecha
          );

        }

        resolve(request.result);

      };

      request.onerror = function(event) {

        reject(event.target.error);

      };

    });

  }


  /* =========================================================
     CONSTRUIR ÍNDICE DE CÓDIGOS DE BARRA

     ESTA ES LA PARTE CORREGIDA.

     Si Google Sheets tiene:

     000312547428330, 007702031518631

     se crean DOS entradas:

     indice["000312547428330"]
     indice["007702031518631"]

     Ambas apuntan al mismo producto.
  ========================================================= */

  /*
     Convierte un código a una forma comparable ignorando ceros
     innecesarios al comienzo.

     Ejemplo:
       000074312017995 -> 074312017995

     IMPORTANTE:
     - NO modifica el código original guardado en los productos.
     - El código original también se guarda en el índice.
     - Así, si el lector entrega cualquiera de las dos formas,
       el producto puede ser encontrado.
  */

  function codigoCanonico(codigo) {

    const normalizado =
      normalizarCodigo(codigo);

    if (!normalizado) {
      return "";
    }

    /*
      Solo quitamos ceros al principio.
      Si el código fuera "0000", dejamos "0" para
      evitar convertirlo en una cadena vacía.
    */

    const sinCerosIniciales =
      normalizado.replace(/^0+(?=\d)/, "");

    return sinCerosIniciales;

  }


  /* =========================================================
     CONSTRUIR ÍNDICE DE CÓDIGOS DE BARRA

     Se guardan DOS formas del código:

     1. El código tal como aparece en el archivo.
     2. El mismo código sin ceros iniciales innecesarios.

     Ejemplo:
       Archivo: 000074312017995

       Índice:
       indice["000074312017995"] = producto
       indice["074312017995"]  = producto

     De esta forma el lector puede entregar:
       000074312017995
     o:
       074312017995

     y ambos encuentran el mismo producto.

     Si hay varios códigos separados por coma, punto y coma,
     salto de línea o "/", cada uno se indexa por separado.
  ========================================================= */

  function construirIndice() {

    indice = {};

    for (let i = 0; i < productos.length; i++) {

      const producto = productos[i];

      const barras =
        String(producto["BARRAS"] || "");

      if (!barras.trim()) {
        continue;
      }

      const codigos =
        barras.split(/[,\n;/]+/);

      for (let j = 0; j < codigos.length; j++) {

        const codigo =
          normalizarCodigo(codigos[j]);

        if (!codigo) {
          continue;
        }

        /*
          Primero guardamos el código EXACTO.
          Esto hace que, si existe un producto con ese
          código exacto, tenga prioridad.
        */
        indice[codigo] = producto;

        /*
          Después guardamos la versión canónica.
          Así se ignoran los ceros agregados al principio.
        */
        const canonico =
          codigoCanonico(codigo);

        if (
          canonico &&
          !indice[canonico]
        ) {
          indice[canonico] = producto;
        }

      }

    }

  }

  /* =========================================================
     MOSTRAR CANTIDAD
  ========================================================= */

  function mostrarCantidad() {

    document.getElementById(
      "cantidadProductos"
    ).textContent = productos.length.toLocaleString("es-CL");

  }


  /* =========================================================
     MOSTRAR FECHA
  ========================================================= */

  function mostrarFecha(fecha) {

    if (!fecha) {

      document.getElementById(
        "ultimaActualizacion"
      ).textContent = "Sin datos";

      return;

    }

    try {

      const fechaObj =
        new Date(fecha);

      document.getElementById(
        "ultimaActualizacion"
      ).textContent =
        fechaObj.toLocaleString(
          "es-CL",
          {
            dateStyle: "short",
            timeStyle: "short"
          }
        );

    } catch (error) {

      document.getElementById(
        "ultimaActualizacion"
      ).textContent = "Disponible";

    }

  }


  /* =========================================================
     MOSTRAR AVISO DE LA BASE
  ========================================================= */

  function mostrarAvisoBase(texto) {
    const aviso = document.getElementById("avisoBase");
    if (!aviso) return;

    const contenido = String(texto || "").trim();

    if (contenido) {
      aviso.textContent = "📢 " + contenido;
      aviso.style.display = "block";

      try {
        localStorage.setItem("lectorProductosAvisoBase", contenido);
      } catch (e) {}
    } else {
      /* No borramos un aviso ya visible por una respuesta vacía accidental. */
      const guardado = (() => {
        try {
          return localStorage.getItem("lectorProductosAvisoBase") || "";
        } catch (e) {
          return "";
        }
      })();

      if (guardado) {
        aviso.textContent = "📢 " + guardado;
        aviso.style.display = "block";
      }
    }
  }


  /* =========================================================
     BUSCAR PRODUCTO LOCALMENTE
  ========================================================= */

  function buscarProductoLocal(codigo) {

    const inicio =
      performance.now();

    const codigoNormalizado =
      normalizarCodigo(codigo);

    /*
      Primero buscamos el código EXACTO.
      Si no existe, buscamos la versión canónica
      sin ceros iniciales innecesarios.
    */

    let producto =
      indice[codigoNormalizado];

    /* También permite buscar directamente por CÓDIGO INTERNO */
    if (!producto) {
      producto = productos.find(p =>
        String(p["CODIGO INTERNO"] || "").trim() === String(codigo).trim()
      );
    }

    if (!producto) {

      const canonico =
        codigoCanonico(codigoNormalizado);

      if (canonico) {
        producto =
          indice[canonico];
      }

    }

    const tiempo =
      Math.round(
        performance.now() - inicio
      );

    if (!producto) {

      document.getElementById(
        "resultado"
      ).style.display = "none";

      const mensaje =
        document.getElementById("mensaje");

      mensaje.className =
        "mensaje error";

      mensaje.textContent =
        "❌ Producto no encontrado.";

      sonidoError();
      vibrar([90,60,90]);

      return;

    }

    mostrarProducto(
      producto,
      tiempo
    );

  }

  /* =========================================================
     MOSTRAR PRODUCTO
  ========================================================= */

  function mostrarProducto(
    producto,
    tiempo
  ) {

    document.getElementById(
      "mensaje"
    ).textContent = "";

    document.getElementById(
      "mensaje"
    ).className = "mensaje";

    document.getElementById(
      "resultado"
    ).style.display = "block";


    /* Código interno */

    document.getElementById(
      "codigoInterno"
    ).textContent =
      producto["CODIGO INTERNO"] || "";


    /* Descriptor */

    document.getElementById(
      "descriptor"
    ).textContent =
      producto["DESCRIPTOR"] || "";


    /* Precio */

    document.getElementById(
      "precio"
    ).textContent =
      formatearPrecio(
        producto["PRECIO"]
      );


    /* Precio OAI */

    const precioOAI =
      producto["PRECIOOAI"];

    const oaiCard =
      document.getElementById(
        "oaiCard"
      );

    const oaiValor =
      document.getElementById(
        "precioOAI"
      );

    const oaiEtiqueta =
      document.getElementById(
        "oaiEtiqueta"
      );

    const esSuperOAI =
      String(producto["SUPER OAI"] || "")
        .trim()
        .toUpperCase() === "SUPER OAI";


    if (
      precioOAI !== undefined &&
      precioOAI !== null &&
      String(precioOAI).trim() !== ""
    ) {

      oaiValor.textContent =
        formatearPrecio(precioOAI);

      if (esSuperOAI) {
        oaiEtiqueta.textContent = "✨ SUPER OAI ✨";
        oaiCard.classList.add("super-oai-card");
      } else {
        oaiEtiqueta.textContent = "Precio OAI";
        oaiCard.classList.remove("super-oai-card");
      }

      oaiCard.classList.remove(
        "oculto"
      );

    } else {

      oaiValor.textContent = "";
      oaiEtiqueta.textContent = "Precio OAI";
      oaiCard.classList.remove("super-oai-card");

      oaiCard.classList.add(
        "oculto"
      );

    }


    /* Sonido del resultado: solo uno según el tipo de producto */
    if (esSuperOAI && precioOAI !== undefined && precioOAI !== null &&
        String(precioOAI).trim() !== "") {
      sonidoSuperOAI();
      vibrar([45,35,45,35,90]);
      animarSuperOAI();
    } else if (precioOAI !== undefined && precioOAI !== null &&
               String(precioOAI).trim() !== "") {
      sonidoOAI();
      vibrar([45,40,75]);
    } else {
      sonidoNormal();
      vibrar(45);
    }


    /* Barras */

    document.getElementById(
      "barras"
    ).textContent =
      producto["BARRAS"] || "";


    /* Tiempo */

    document.getElementById(
      "tiempoBusqueda"
    ).textContent =
      "Búsqueda local: " +
      tiempo +
      " ms";

  }


  /* =========================================================
     FORMATEAR PRECIO
  ========================================================= */

  function formatearPrecio(valor) {

    if (
      valor === null ||
      valor === undefined ||
      String(valor).trim() === ""
    ) {

      return "Sin precio";

    }

    const texto =
      String(valor).trim();

    /*
      Si contiene formatos como:
      2X11490
      2x5990

      los dejamos tal cual.
    */

    if (
      /x/i.test(texto)
    ) {

      return texto;

    }

    /*
      Si ya viene con $,
      intentamos mostrarlo correctamente.
    */

    if (
      texto.includes("$")
    ) {

      return texto;

    }

    /*
      Convertir números normales
      a formato chileno.
    */

    const numero =
      Number(
        texto.replace(
          /[^\d.,-]/g,
          ""
        ).replace(
          /\./g,
          ""
        ).replace(
          ",",
          "."
        )
      );

    if (
      !isNaN(numero)
    ) {

      return "$ " +
        Math.round(numero)
          .toLocaleString("es-CL");

    }

    return texto;

  }


  /* =========================================================
     ACTUALIZAR PRODUCTOS DESDE GOOGLE SHEETS
  ========================================================= */

  function actualizarProductos() {

    const mensaje =
      document.getElementById(
        "mensaje"
      );

    mensaje.className =
      "mensaje cargando";

    mensaje.textContent =
      "⏳ Actualizando productos...";

    const callbackName =
      "callbackProductos_" +
      Date.now();


    window[callbackName] =
      function(data) {

        try {

          if (
            !data ||
            !Array.isArray(data.productos)
          ) {

            throw new Error(
              "Respuesta inválida"
            );

          }

          productos =
            data.productos;

          mostrarAvisoBase(data.mensaje);

          construirIndice();

          mostrarCantidad();

          guardarProductos()
            .then(function() {

              mostrarFecha(
                new Date().toISOString()
              );

              mensaje.className =
                "mensaje";

              mensaje.textContent =
                "✅ Productos actualizados correctamente.";

            })
            .catch(function(error) {

              console.error(error);

              mensaje.className =
                "mensaje error";

              mensaje.textContent =
                "⚠️ Productos cargados, pero no se pudieron guardar localmente.";

            });

        } catch (error) {

          console.error(error);

          mensaje.className =
            "mensaje error";

          mensaje.textContent =
            "❌ Error procesando los productos.";

        }

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

        delete window[callbackName];

      };


    const script =
      document.createElement("script");

    script.id =
      callbackName;

    script.src =
      API_URL +
      "?accion=productos&callback=" +
      callbackName +
      "&t=" +
      Date.now();

    script.onerror =
      function() {

        mensaje.className =
          "mensaje error";

        mensaje.textContent =
          "❌ No se pudo conectar con Google Sheets.";

        script.remove();

        delete window[callbackName];

      };


    document.body.appendChild(script);

  }


  /* =========================================================
     INPUT DE BÚSQUEDA
  ========================================================= */

  document
    .getElementById("codigoInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          buscarProductoLocal(
            this.value
          );

          this.select();

        }

      }
    );


  /*
    También buscamos automáticamente
    cuando el lector pega/escribe un código.
  */

  let ultimoValor = "";

  document
    .getElementById("codigoInput")
    .addEventListener(
      "input",
      function() {

        const valor =
          this.value;

        /*
          Evitamos búsquedas repetidas.
        */

        if (
          valor === ultimoValor
        ) {
          return;
        }

        ultimoValor = valor;

        /*
          Los códigos de barra normalmente
          tienen entre 8 y 14 dígitos.

          No buscamos demasiado pronto
          mientras todavía se está escaneando.
        */

        const codigo =
          normalizarCodigo(valor);

        if (
          codigo.length >= 8
        ) {

          if (
            indice[codigo]
          ) {

            buscarProductoLocal(
              codigo
            );

            this.select();

          }

        }

      }
    );


  /* =========================================================
     ESCÁNER

     En PC no hay cámara.
     En teléfonos se puede utilizar el lector
     integrado del navegador si está disponible.
  ========================================================= */

  async function iniciarEscaner() {

    const esIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let overlay = null;
    let video = null;
    let stream = null;
    let controlesZXing = null;
    let cerrado = false;

    function crearVisor() {

      overlay = document.createElement("div");
      overlay.style.position = "fixed";
      overlay.style.inset = "0";
      overlay.style.background = "#000";
      overlay.style.zIndex = "9999";
      overlay.style.display = "flex";
      overlay.style.alignItems = "center";
      overlay.style.justifyContent = "center";

      video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.style.width = "100%";
      video.style.height = "100%";
      video.style.objectFit = "cover";

      const marco = document.createElement("div");
      marco.style.position = "absolute";
      marco.style.left = "10%";
      marco.style.right = "10%";
      marco.style.top = "38%";
      marco.style.height = "24%";
      marco.style.border = "3px solid #FFD500";
      marco.style.borderRadius = "18px";
      marco.style.boxShadow = "0 0 0 9999px rgba(0,0,0,0.20)";
      marco.style.pointerEvents = "none";

      const texto = document.createElement("div");
      texto.textContent = "Apunta la cámara al código de barras";
      texto.style.position = "absolute";
      texto.style.top = "20px";
      texto.style.left = "20px";
      texto.style.right = "20px";
      texto.style.color = "white";
      texto.style.textAlign = "center";
      texto.style.fontWeight = "bold";
      texto.style.fontSize = "16px";
      texto.style.textShadow = "0 2px 4px rgba(0,0,0,0.8)";

      const cerrar = document.createElement("button");
      cerrar.textContent = "✕ CERRAR";
      cerrar.style.position = "absolute";
      cerrar.style.bottom = "28px";
      cerrar.style.left = "50%";
      cerrar.style.transform = "translateX(-50%)";
      cerrar.style.zIndex = "10001";
      cerrar.style.background = "white";
      cerrar.style.color = "#00843D";
      cerrar.style.padding = "13px 20px";
      cerrar.style.borderRadius = "12px";
      cerrar.style.fontWeight = "bold";

      cerrar.onclick = detenerEscaner;

      const linterna = document.createElement("button");
      linterna.id = "btnLinterna";
      linterna.textContent = "🔦 LINTERNA";
      linterna.style.position = "absolute";
      linterna.style.bottom = "88px";
      linterna.style.left = "50%";
      linterna.style.transform = "translateX(-50%)";
      linterna.style.zIndex = "10001";
      linterna.style.background = "#fff8d7";
      linterna.style.color = "#4b3b00";
      linterna.style.padding = "11px 16px";
      linterna.style.borderRadius = "12px";
      linterna.style.fontWeight = "bold";
      linterna.style.display = "none";

      linterna.onclick = async function() {
        if (!stream) return;
        const track = stream.getVideoTracks()[0];
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();
        if (!caps.torch) return;
        const encendida = linterna.dataset.on !== "1";
        try {
          await track.applyConstraints({advanced:[{torch:encendida}]});
          linterna.dataset.on = encendida ? "1" : "0";
          linterna.textContent = encendida ? "💡 LINTERNA ENCENDIDA" : "🔦 LINTERNA";
          linterna.style.background = encendida ? "#ffe76d" : "#fff8d7";
          vibrar(25);
        } catch(e) {}
      };

      overlay.appendChild(video);
      overlay.appendChild(marco);
      overlay.appendChild(texto);
      overlay.appendChild(linterna);
      overlay.appendChild(cerrar);
      document.body.appendChild(overlay);

    }

    function detenerEscaner() {

      if (cerrado) {
        return;
      }

      cerrado = true;

      try {
        if (controlesZXing && typeof controlesZXing.stop === "function") {
          controlesZXing.stop();
        }
      } catch (error) {
        console.error(error);
      }

      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (error) {
        console.error(error);
      }

      if (video && video.srcObject) {
        try {
          video.srcObject.getTracks().forEach(track => track.stop());
        } catch (error) {
          console.error(error);
        }
        video.srcObject = null;
      }

      if (overlay) {
        overlay.remove();
      }

    }

    function codigoDetectado(codigo) {

      if (!codigo || cerrado) {
        return;
      }

      const valor = String(codigo).trim();

      if (!valor) {
        return;
      }

      sonidoLectura();
      detenerEscaner();

      const input = document.getElementById("codigoInput");
      input.value = valor;

      buscarProductoLocal(valor);

    }

    crearVisor();

    /*
      iPhone/iPad: usamos ZXing directamente porque Safari no ofrece
      BarcodeDetector de forma suficientemente consistente.
    */
    if (esIOS) {

      try {

        if (
          typeof ZXingBrowser === "undefined" ||
          !ZXingBrowser.BrowserMultiFormatReader
        ) {
          throw new Error("ZXing no está disponible");
        }

        const lector =
          new ZXingBrowser.BrowserMultiFormatReader();

        const restricciones = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        controlesZXing =
          await lector.decodeFromConstraints(
            restricciones,
            video,
            function(resultado, error, controles) {

              if (controles && !controlesZXing) {
                controlesZXing = controles;
              }

              if (resultado) {
                codigoDetectado(resultado.getText());
              }

            }
          );

        return;

      } catch (error) {

        console.error("Error ZXing iOS:", error);
        detenerEscaner();

        alert(
          "No se pudo iniciar la cámara. Revisa que Safari tenga permiso para usar la cámara y vuelve a intentarlo."
        );

        return;

      }

    }

    /*
      Android/Chrome y navegadores compatibles:
      mantenemos BarcodeDetector, que ya funcionaba en tu versión actual.
    */
    if ("BarcodeDetector" in window) {

      try {

        const formatos =
          await BarcodeDetector.getSupportedFormats();

        const detector =
          new BarcodeDetector({ formats: formatos });

        stream =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" }
            }
          });

        video.srcObject = stream;
        await video.play();

        try {
          const track = stream.getVideoTracks()[0];
          const caps = track?.getCapabilities?.();
          if (caps?.torch) {
            document.getElementById("btnLinterna").style.display = "block";
          }
        } catch(e) {}

        const buscar = async function() {

          if (cerrado) {
            return;
          }

          try {

            const detecciones =
              await detector.detect(video);

            if (detecciones.length > 0) {
              codigoDetectado(detecciones[0].rawValue);
              return;
            }

          } catch (error) {
            console.error(error);
          }

          requestAnimationFrame(buscar);

        };

        buscar();
        return;

      } catch (error) {
        console.error("Error BarcodeDetector:", error);
      }

    }

    /*
      Fallback ZXing para otros navegadores móviles.
    */
    try {

      if (
        typeof ZXingBrowser === "undefined" ||
        !ZXingBrowser.BrowserMultiFormatReader
      ) {
        throw new Error("ZXing no está disponible");
      }

      const lector =
        new ZXingBrowser.BrowserMultiFormatReader();

      controlesZXing =
        await lector.decodeFromConstraints(
          {
            audio: false,
            video: {
              facingMode: { ideal: "environment" }
            }
          },
          video,
          function(resultado, error, controles) {

            if (controles && !controlesZXing) {
              controlesZXing = controles;
            }

            if (resultado) {
              codigoDetectado(resultado.getText());
            }

          }
        );

    } catch (error) {

      console.error("Error al iniciar el escáner:", error);
      detenerEscaner();

      alert(
        "No se pudo iniciar el lector de cámara. Asegúrate de abrir la página mediante HTTPS y permitir el acceso a la cámara."
      );

    }

  }


  /* =========================================================
     CARGAR AVISO DESDE CONFIG
  ========================================================= */

  function cargarAvisoBase() {
    const callbackName = "callbackAviso_" + Date.now();

    window[callbackName] = function(data) {
      try {
        mostrarAvisoBase(data && data.mensaje);
      } catch (error) {
        console.error("Error mostrando aviso:", error);
      }

      const script = document.getElementById(callbackName);
      if (script) script.remove();
      delete window[callbackName];
    };

    const script = document.createElement("script");
    script.id = callbackName;
    script.src =
      API_URL +
      "?accion=aviso&callback=" +
      callbackName +
      "&t=" +
      Date.now();

    script.onerror = function() {
      script.remove();
      delete window[callbackName];
    };

    document.body.appendChild(script);
  }


  /* =========================================================
     INICIO
  ========================================================= */

  async function iniciar() {

    try {

      await abrirDB();

      try {
        const avisoGuardado =
          localStorage.getItem("lectorProductosAvisoBase");

        if (avisoGuardado) {
          mostrarAvisoBase(avisoGuardado);
        }
      } catch (e) {}

      cargarAvisoBase();

      const datos =
        await cargarProductosGuardados();

      if (
        datos &&
        productos.length > 0
      ) {

        document.getElementById(
          "mensaje"
        ).textContent =
          "✅ Productos disponibles. Puedes escanear.";

      } else {

        document.getElementById(
          "mensaje"
        ).textContent =
          "📥 Presiona ACTUALIZAR PRODUCTOS para cargar la base.";

      }

    } catch (error) {

      console.error(error);

      document.getElementById(
        "mensaje"
      ).className =
        "mensaje error";

      document.getElementById(
        "mensaje"
      ).textContent =
        "⚠️ No se pudo acceder a la base local.";

    }

  }


  iniciar();

</script>


<script>
(function () {
  const THEME_KEY = "lectorProductosTema";
  const validThemes = ["default", "dark", "pink"];

  function applyTheme(theme) {
    if (!validThemes.includes(theme)) theme = "default";
    document.body.setAttribute("data-theme", theme);

    document.querySelectorAll("[data-set-theme]").forEach(btn => {
      btn.classList.toggle("activo", btn.dataset.setTheme === theme);
    });

    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (e) {}
  }

  let savedTheme = "default";
  try {
    const stored = localStorage.getItem(THEME_KEY);
    if (validThemes.includes(stored)) savedTheme = stored;
  } catch (e) {}

  applyTheme(savedTheme);

  document.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-set-theme]");
    if (!btn) return;
    applyTheme(btn.dataset.setTheme);
  });
})();
</script>
