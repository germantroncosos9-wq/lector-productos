<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Lector de Productos</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #estado {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #mensaje {
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
    }

    #resultado {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .dato {
      margin-bottom: 18px;
    }

    .titulo {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      background: #222;
      color: white;
    }

    #actualizar {
      background: #1976d2;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>📦 Lector de Productos</h1>

  <div id="estado">
    Cargando productos...
  </div>


  <div id="reader"></div>


  <div id="mensaje">
    Preparando lector...
  </div>


  <div id="resultado">

    <div class="dato">

      <div class="titulo">
        CODIGO INTERNO
      </div>

      <div class="valor"
           id="codigoInterno">
      </div>

    </div>


    <div class="dato">

      <div class="titulo">
        DESCRIPTOR
      </div>

      <div class="valor"
           id="descriptor">
      </div>

    </div>


    <div class="dato">

      <div class="titulo">
        PRECIO
      </div>

      <div class="valor"
           id="precio">
      </div>

    </div>


    <div class="dato">

      <div class="titulo">
        PRECIO OAI
      </div>

      <div class="valor"
           id="precioOAI">
      </div>

    </div>


    <div class="dato">

      <div class="titulo">
        BARRAS
      </div>

      <div class="valor"
           id="barras">
      </div>

    </div>

  </div>


  <button id="actualizar"
          onclick="actualizarBase()">

    🔄 ACTUALIZAR PRODUCTOS

  </button>


  <button onclick="iniciarScanner()">

    📷 ESCANEAR NUEVAMENTE

  </button>

</div>


<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwdoaOE00ZM9cv_Lti5UCq6ayxd_NqjMhdkNmWzAU_2xWVfZukHaMytNnrmHkEKqTNp/exec";


// =====================================================
// VARIABLES
// =====================================================

let productos = [];

let indice = {};

let scanner = null;

let escaneando = false;


// =====================================================
// CARGAR BASE
// =====================================================

function cargarBase() {

  document.getElementById("estado").innerText =
    "⬇️ Descargando productos...";


  fetch(API_URL + "?accion=productos")

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "Error HTTP " + response.status
        );

      }

      return response.json();

    })


    .then(function(data) {

      productos = data;

      construirIndice();

      guardarBaseLocal();

      document.getElementById("estado").innerText =
        "✅ " + productos.length +
        " productos cargados";


      document.getElementById("mensaje").innerText =
        "📷 Apunta la cámara a un código de barras";


      iniciarScanner();

    })


    .catch(function(error) {

      console.error(error);


      // Intentar cargar una copia local.

      cargarBaseLocal();

    });

}


// =====================================================
// CREAR ÍNDICE
// =====================================================

function construirIndice() {

  indice = {};


  for (
    let i = 0;
    i < productos.length;
    i++
  ) {

    const producto = productos[i];

    const barras =
      String(producto["BARRAS"] || "").trim();


    if (!barras) {
      continue;
    }


    indice[barras] = producto;

  }

}


// =====================================================
// GUARDAR EN EL CELULAR
// =====================================================

function guardarBaseLocal() {

  try {

    localStorage.setItem(
      "productos",
      JSON.stringify(productos)
    );

    localStorage.setItem(
      "fechaActualizacion",
      new Date().toISOString()
    );

  } catch (error) {

    console.error(
      "No se pudo guardar la base local",
      error
    );

  }

}


// =====================================================
// CARGAR BASE LOCAL
// =====================================================

function cargarBaseLocal() {

  try {

    const datos =
      localStorage.getItem("productos");


    if (!datos) {

      document.getElementById("estado").innerText =
        "❌ No se pudo cargar la base.";

      document.getElementById("mensaje").innerText =
        "Necesitas conexión a Internet para descargar los productos.";

      return;

    }


    productos = JSON.parse(datos);

    construirIndice();


    const fecha =
      localStorage.getItem(
        "fechaActualizacion"
      );


    document.getElementById("estado").innerText =
      "📱 " + productos.length +
      " productos guardados";


    document.getElementById("mensaje").innerText =
      "📷 Lector disponible";


    iniciarScanner();


  } catch (error) {

    console.error(error);

    document.getElementById("estado").innerText =
      "❌ Error cargando productos.";

  }

}


// =====================================================
// ACTUALIZAR BASE
// =====================================================

function actualizarBase() {

  document.getElementById("estado").innerText =
    "⬇️ Actualizando productos...";


  fetch(API_URL + "?accion=productos")

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "Error HTTP " + response.status
        );

      }

      return response.json();

    })


    .then(function(data) {

      productos = data;

      construirIndice();

      guardarBaseLocal();


      document.getElementById("estado").innerText =
        "✅ Actualizado: " +
        productos.length +
        " productos";


      document.getElementById("mensaje").innerText =
        "📷 Listo para escanear";

    })


    .catch(function(error) {

      console.error(error);

      document.getElementById("estado").innerText =
        "❌ No se pudo actualizar.";

    });

}


// =====================================================
// INICIAR CÁMARA
// =====================================================

function iniciarScanner() {

  if (escaneando) {
    return;
  }


  if (productos.length === 0) {

    document.getElementById("mensaje").innerText =
      "⏳ Esperando productos...";

    return;

  }


  escaneando = true;


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 300,
        height: 150
      }

    },


    function(codigoDetectado) {

      detenerScanner();


      buscarProductoLocal(
        codigoDetectado
      );

    },


    function(error) {

      // Ignorar errores normales
      // de lectura.

    }

  )


  .catch(function(error) {

    console.error(error);

    escaneando = false;


    document.getElementById("mensaje").innerText =
      "❌ No se pudo acceder a la cámara.";

  });

}


// =====================================================
// DETENER CÁMARA
// =====================================================

function detenerScanner() {

  if (!scanner) {

    escaneando = false;

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      escaneando = false;

    })

    .catch(function(error) {

      console.error(error);

      scanner = null;

      escaneando = false;

    });

}


// =====================================================
// BUSCAR LOCALMENTE
// =====================================================

function buscarProductoLocal(codigo) {

  const inicio =
    performance.now();


  const producto =
    indice[String(codigo).trim()];


  const tiempo =
    Math.round(
      performance.now() - inicio
    );


  console.log(
    "Búsqueda local:",
    tiempo + " ms"
  );


  if (!producto) {

    document.getElementById("mensaje").innerText =
      "❌ Producto no encontrado.";

    limpiarResultado();

    return;

  }


  mostrarProducto(
    producto,
    tiempo
  );

}


// =====================================================
// MOSTRAR PRODUCTO
// =====================================================

function mostrarProducto(
  producto,
  tiempo
) {

  document.getElementById("mensaje").innerText =
    "✅ Encontrado en " +
    tiempo +
    " ms";


  document.getElementById("codigoInterno").innerText =
    producto["CODIGO INTERNO"] || "-";


  document.getElementById("descriptor").innerText =
    producto["DESCRIPTOR"] || "-";


  document.getElementById("precio").innerText =
    producto["PRECIO"] || "-";


  document.getElementById("precioOAI").innerText =
    producto["PRECIOOAI"] || "-";


  document.getElementById("barras").innerText =
    producto["BARRAS"] || "-";

}


// =====================================================
// LIMPIAR RESULTADO
// =====================================================

function limpiarResultado() {

  document.getElementById("codigoInterno").innerText =
    "";

  document.getElementById("descriptor").innerText =
    "";

  document.getElementById("precio").innerText =
    "";

  document.getElementById("precioOAI").innerText =
    "";

  document.getElementById("barras").innerText =
    "";

}


// =====================================================
// INICIAR
// =====================================================

cargarBase();


</script>

</body>

</html>
